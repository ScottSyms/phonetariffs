name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  credentials:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN repository secret to enable deployments."
          fi

  deploy:
    needs: credentials
    if: needs.credentials.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # dfrp-rbif.xml is stored in Git LFS; the build cannot run without it.
          lfs: true

      - uses: jdx/mise-action@v2

      - name: Install Python dependencies
        run: pip install -r python/requirements.txt

      - name: Build DuckDB database
        run: python python/build_database.py build

      - name: Export D1 SQL
        run: python python/export_cloudflare.py

      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm ci

      - name: Typecheck and test
        working-directory: cloudflare
        run: |
          npm run typecheck
          npm run test

      - name: Apply D1 migrations
        working-directory: cloudflare
        run: npx wrangler d1 migrations apply phonetariffs --remote

      - name: Load data into D1
        run: node cloudflare/scripts/seed-local.mjs --remote

      - name: Deploy Worker
        working-directory: cloudflare
        run: npx wrangler deploy

      - name: Smoke test
        if: vars.SITE_URL != ''
        run: |
          curl -fsS "${{ vars.SITE_URL }}/api/meta" | tee /tmp/meta.json
          python -c "import json;d=json.load(open('/tmp/meta.json'));assert d['properties']>0, d"
